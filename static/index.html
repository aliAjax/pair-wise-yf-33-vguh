<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>卫星地面站接力排程台</title>
<style>body{font:15px system-ui;max-width:1100px;margin:40px auto;background:#eef5f7;padding:0 20px;color:#102a43}section{background:white;padding:20px;border-radius:12px;margin:16px 0;box-shadow:0 2px 12px #0001}pre{background:#071827;color:#67e8f9;padding:16px;border-radius:8px;overflow:auto}input,button{font:inherit;padding:8px;margin:4px}button{background:#0369a1;color:white;border:0;border-radius:6px}</style>
<h1>卫星地面站接力排程台</h1><p>查看请求、接力段与站点状态。写入使用 JSON API，身份由 X-User-Id、X-Role 和租户头提供；requester 只能看到自己租户的接力段，auditor 只读。</p><section><input id="u" value="operator"><input id="r" value="operator"><input id="t" placeholder="tenant（requester 必填）"><button onclick="load()">刷新</button><pre id="o"></pre></section>
<script>
async function load(){
  let h={'X-User-Id':u.value,'X-Role':r.value}; if(t.value.trim())h['X-Tenant']=t.value.trim();
  let x=await fetch('/api/state',{headers:h});o.textContent=JSON.stringify(await x.json(),null,2)
}
load();
</script>
